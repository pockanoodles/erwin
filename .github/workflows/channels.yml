# Package managers, after a release is published.
#
# Publishing a release (the draft that release.yml makes) renders the Homebrew
# cask, the winget manifests and the AUR PKGBUILD from its SHA256SUMS.txt with
# scripts/release/update-manifests.mjs, pushes each one to its channel, and
# releases this version's snap, which release.yml put on edge, to stable.
# The files in packaging/ stay templates; what a release rendered is kept as
# the run's `manifests` artifact.
#
# Each channel runs only when its secret exists, so the workflow succeeds with
# none of them. A manual run redoes one release. Pre-releases stop after the
# plan: the manifests carry stable versions only. Secrets and the first push to
# each channel are in packaging/README.md.

name: Channels

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, vX.Y.Z
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: channels-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
      tap: ${{ steps.gates.outputs.tap }}
      aur: ${{ steps.gates.outputs.aur }}
      winget: ${{ steps.gates.outputs.winget }}
      snap: ${{ steps.gates.outputs.snap }}
    steps:
      - name: Read the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::$TAG is not a vX.Y.Z tag"
            exit 1
          fi
          version="${TAG#v}"
          stable=true
          if [[ "$version" == *-* ]]; then stable=false; fi
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "stable=$stable"
          } >> "$GITHUB_OUTPUT"

      # Job conditions cannot read secrets, so the plan records which exist.
      - name: Check which secrets exist
        id: gates
        env:
          HAS_TAP: ${{ secrets.TAP_DEPLOY_KEY != '' }}
          HAS_AUR: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
          HAS_WINGET: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN != '' }}
          HAS_SNAP: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
          STABLE: ${{ steps.version.outputs.stable }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          all() { if [ "$1" = true ] && [ "$2" = true ]; then echo true; else echo false; fi; }
          tap="$(all "$HAS_TAP" "$STABLE")"
          aur="$(all "$HAS_AUR" "$STABLE")"
          winget="$(all "$HAS_WINGET" "$STABLE")"
          snap="$(all "$HAS_SNAP" "$STABLE")"
          {
            echo "tap=$tap"
            echo "aur=$aur"
            echo "winget=$winget"
            echo "snap=$snap"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Channels for $TAG"
            echo "| Channel | Runs |"
            echo "| --- | --- |"
            echo "| Homebrew tap | $tap |"
            echo "| AUR | $aur |"
            echo "| winget | $winget |"
            echo "| Snap Store (edge to stable) | $snap |"
          } >> "$GITHUB_STEP_SUMMARY"

  render:
    name: Render the manifests
    needs: plan
    if: needs.plan.outputs.stable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The AUR checksums for LICENSE and the icon come from the tag's files.
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "::error::$TAG is not published. The manifests point at published files."
            exit 1
          fi
          gh release download "$TAG" -p SHA256SUMS.txt -D "$RUNNER_TEMP/release"

      # --check after the rewrite fails the run if a placeholder is left.
      - name: Render
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          sums="$RUNNER_TEMP/release/SHA256SUMS.txt"
          node scripts/release/update-manifests.mjs "$VERSION" "$sums"
          node scripts/release/update-manifests.mjs "$VERSION" "$sums" --check
          git diff --stat packaging

      - name: Keep the manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifests
          path: |
            packaging/homebrew/sigwald.rb
            packaging/winget/*.yaml
            packaging/aur/sigwald-bin/PKGBUILD
            packaging/aur/sigwald-bin/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  tap:
    name: Homebrew tap
    needs: [plan, render]
    if: needs.plan.outputs.tap == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifests
          path: manifests

      # GitHub's host keys come from its API over TLS, not from first contact.
      - name: Set up the deploy key
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts

      - name: Push the cask
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          GIT_SSH_COMMAND: ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        run: |
          set -euo pipefail
          git clone --depth 1 git@github.com:pockanoodles/homebrew-tap.git tap
          mkdir -p tap/Casks
          cp manifests/homebrew/sigwald.rb tap/Casks/sigwald.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/sigwald.rb
          if git diff --cached --quiet; then
            echo "The tap already has sigwald $VERSION."
            exit 0
          fi
          git commit -m "sigwald $VERSION"
          git push origin HEAD

  aur:
    name: AUR
    needs: [plan, render]
    if: needs.plan.outputs.aur == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifests
          path: manifests

      # The host key must match the ED25519 fingerprint the AUR publishes on
      # https://aur.archlinux.org.
      - name: Set up the SSH key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_ED25519: SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan -t ed25519 aur.archlinux.org > "$RUNNER_TEMP/aur_host" 2>/dev/null
          found="$(ssh-keygen -lf "$RUNNER_TEMP/aur_host" | awk '{print $2}')"
          if [ "$found" != "$AUR_ED25519" ]; then
            echo "::error::aur.archlinux.org offered $found, expected $AUR_ED25519"
            exit 1
          fi
          cat "$RUNNER_TEMP/aur_host" > ~/.ssh/known_hosts

      # The AUR takes only master. Cloning a name that doesn't exist yet gives
      # an empty repository, and the first push creates the package.
      - name: Push the package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          GIT_SSH_COMMAND: ssh -i ~/.ssh/aur_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        run: |
          set -euo pipefail
          git clone ssh://aur@aur.archlinux.org/sigwald-bin.git aur
          cp manifests/aur/sigwald-bin/PKGBUILD manifests/aur/sigwald-bin/.SRCINFO aur/
          cd aur
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "The AUR already has sigwald-bin $VERSION."
            exit 0
          fi
          git commit -m "sigwald-bin $VERSION"
          git push origin HEAD:master

  winget:
    name: winget
    needs: [plan, render]
    if: needs.plan.outputs.winget == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download the manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifests
          path: manifests

      # Pinned, and checked against the hash Microsoft publishes beside it.
      - name: Get wingetcreate
        env:
          WINGETCREATE_URL: https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe
          WINGETCREATE_SHA256: 24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA
        run: |
          Invoke-WebRequest $env:WINGETCREATE_URL -OutFile wingetcreate.exe
          $hash = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash
          if ($hash -ne $env:WINGETCREATE_SHA256) { throw "wingetcreate.exe is $hash, expected $env:WINGETCREATE_SHA256" }

      # wingetcreate reads the token from WINGET_CREATE_GITHUB_TOKEN, which
      # keeps it off the command line. It forks microsoft/winget-pkgs into the
      # token's account and opens the pull request from there. It never checks
      # for an earlier submission, so this step does: a re-run must not open a
      # second pull request.
      - name: Submit to winget-pkgs
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          gh api "repos/microsoft/winget-pkgs/contents/manifests/k/KaitoSoeno/Sigwald/$env:VERSION" --silent 2>$null
          if ($LASTEXITCODE -eq 0) {
            "winget-pkgs already has KaitoSoeno.Sigwald $env:VERSION."
            exit 0
          }
          $open = gh pr list -R microsoft/winget-pkgs --state open --search "KaitoSoeno.Sigwald version $env:VERSION in:title" --json number --jq length
          if ($LASTEXITCODE -ne 0) { throw "gh pr list exited $LASTEXITCODE" }
          if ($open -ne "0") {
            "A pull request for KaitoSoeno.Sigwald $env:VERSION is already open."
            exit 0
          }
          ./wingetcreate.exe submit --no-open --prtitle "KaitoSoeno.Sigwald version $env:VERSION" manifests/winget
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate exited $LASTEXITCODE" }

  # release.yml uploads every tagged build's snap to edge, pre-releases
  # included, so edge may hold a newer build than this one. This releases the
  # revision whose version is this release's, and fails if there is none.
  # `needs: render` keeps a draft's snap off stable. The first stable release
  # goes through the Snap Store review.
  snap:
    name: Snap Store (to stable)
    needs: [plan, render]
    if: needs.plan.outputs.snap == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Release this version's revision
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          sudo snap install snapcraft --classic
          # Newest first. Columns are found by their headers, since snapcraft
          # has renamed this command before (list-revisions, 9.x).
          revisions="$(snapcraft revisions sigwald --arch amd64)"
          echo "$revisions"
          rev="$(awk -v v="$VERSION" '
            NR == 1 { for (i = 1; i <= NF; i++) { if ($i == "Rev.") r = i; if ($i == "Version") c = i }; next }
            r && c && $c == v { print $r; exit }' <<< "$revisions")"
          if [ -z "$rev" ]; then
            echo "::error::No amd64 revision of sigwald has version $VERSION"
            exit 1
          fi
          snapcraft release sigwald "$rev" stable
