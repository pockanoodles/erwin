services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Production stage: standalone `next build` + `node server.js`. The dev
      # server compiled every route on demand, which made the UI feel laggy.
      target: production
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Inside the compose network, Postgres/Redis live at service hostnames —
      # these override the host-oriented localhost values from .env.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-erwin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-erwin}
      - REDIS_URL=redis://redis:6379
      # Next standalone binds this host; without it the server can bind
      # localhost-only inside the container and break the port mapping.
      - HOSTNAME=0.0.0.0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Migrations run in this container's entrypoint, then `next dev` binds :3000.
    # Once the port is listening the schema is up — the worker gates on this.
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  # BullMQ scheduler + worker: periodic Canvas + CalDAV sync for all eligible
  # users/feeds. Shares the app image (development stage) so the sync logic in
  # src/lib/erwin/* and the queue wrapper in src/worker/* are already present.
  # Separate process by design (see package.json start:worker / start:worker:prod).
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-erwin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-erwin}
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Wait for the app so migrations have applied before the worker queries.
      app:
        condition: service_healthy
    # Override the app entrypoint (which runs migrate deploy) — the app owns
    # migrations. Here: generate the client, compile the worker, then run it.
    entrypoint: ["/bin/sh", "-c"]
    command: ["npx --yes prisma generate && npm run build:worker && npm run start:worker"]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-erwin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-erwin}
    # Loopback only: reachable from this machine for `npm run dev` and Prisma,
    # not from the network. The app and worker reach it as `db` on the compose
    # network and do not need the published port.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_dev_data:
