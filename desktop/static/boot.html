<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src file:; img-src data:">
<meta name="color-scheme" content="dark light">
<title>Sigwald</title>
<style>
  /* The boot screen: what you see for the second or two before the server
     answers, and the failure screen if it never does. Tokens mirror
     brand/tokens.css; a file:// page cannot import it at runtime. */
  :root {
    --stage: #0e0d08; --ink: #f0e7d3; --muted: #c0b6a2; --faint: #928c7b;
    --line: #323127; --line-strong: #4d4b40; --accent: #cf6136; --on-accent: #120c07; --danger: #ef6661;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --stage: #f3eddb; --ink: #1b1a0f; --muted: #514d3e; --faint: #686557;
      --line: #d8d4c6; --line-strong: #b5b1a0; --accent: #b3491b; --on-accent: #fdfaf3; --danger: #b9292d;
      color-scheme: light;
    }
  }
  /* The app's faces, bundled (fonts/OFL.txt): this page loads before any server exists. */
  @font-face { font-family: "Michroma"; src: url("fonts/Michroma.woff2") format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Chivo"; src: url("fonts/Chivo.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
  @font-face { font-family: "Chivo Mono"; src: url("fonts/ChivoMono.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--stage); color: var(--ink);
    font: 15px/1.5 "Chivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; place-items: center; padding: 32px; -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
    /* The window has no title bar on macOS; the boot screen drags it. */
    -webkit-app-region: drag;
  }
  button, pre { -webkit-app-region: no-drag; }
  main { width: min(440px, 100%); display: grid; gap: 22px; }
  .mark { display: flex; align-items: center; gap: 12px; font: 400 15px/1 "Michroma", ui-sans-serif, sans-serif; letter-spacing: 0.14em; color: var(--ink); }
  .mark svg { width: 30px; height: 30px; flex: none; }
  .mark .plate { fill: var(--ink); }
  .mark .index { fill: var(--accent); }
  h1 { margin: 0; font-size: 24px; line-height: 1.2; letter-spacing: -0.01em; font-weight: 500; }
  /* Three steps on a railroad track; the lit segment is where we are. */
  .track { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .track i { height: 6px; background: var(--line); position: relative; }
  .track i.on { background: var(--accent); }
  .track i.live::after {
    content: ""; position: absolute; inset: 0; background: var(--accent);
    transform-origin: left; animation: fill 1.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite alternate;
  }
  @keyframes fill { from { transform: scaleX(0.15); } to { transform: scaleX(1); } }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; font: 500 11px/1.3 "Chivo Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
  .steps .on { color: var(--ink); }
  .fail { display: none; gap: 14px; }
  .failed .fail { display: grid; }
  .failed .track, .failed .steps { display: none; }
  .failed h1 { color: var(--danger); }
  pre {
    margin: 0; max-height: 180px; overflow: auto; padding: 12px; border: 1px solid var(--line-strong);
    font: 12px/1.45 "Chivo Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--muted);
    white-space: pre-wrap; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text;
  }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  /* The kit's plates (brand/BRAND.md § Components): rust for the main action,
     corner brackets for the quiet one. */
  button {
    --cut: 5px; --plate: var(--accent); --bracket: var(--muted);
    font: 700 12px/1 "Chivo", ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 12px 18px; min-height: 40px; cursor: pointer; border: 0; color: var(--ink);
    background:
      linear-gradient(var(--bracket) 0 0) top left / 7px 1.5px no-repeat, linear-gradient(var(--bracket) 0 0) top left / 1.5px 7px no-repeat,
      linear-gradient(var(--bracket) 0 0) top right / 7px 1.5px no-repeat, linear-gradient(var(--bracket) 0 0) top right / 1.5px 7px no-repeat,
      linear-gradient(var(--bracket) 0 0) bottom left / 7px 1.5px no-repeat, linear-gradient(var(--bracket) 0 0) bottom left / 1.5px 7px no-repeat,
      linear-gradient(var(--bracket) 0 0) bottom right / 7px 1.5px no-repeat, linear-gradient(var(--bracket) 0 0) bottom right / 1.5px 7px no-repeat;
  }
  button:hover { --bracket: var(--ink); }
  button.primary {
    color: var(--on-accent);
    background:
      linear-gradient(135deg, transparent var(--cut), var(--plate) calc(var(--cut) + 0.5px)) top left / 100% 51% no-repeat,
      linear-gradient(-45deg, transparent var(--cut), var(--plate) calc(var(--cut) + 0.5px)) bottom right / 100% 51% no-repeat;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .track i.live::after { animation: none; } }
</style>
</head>
<body>
<main id="boot">
  <div class="mark"><svg viewBox="0 0 64 64" aria-hidden="true"><path class="plate" fill-rule="evenodd" d="M16 4H60V48L48 60H4V16ZM11 14h1v4h-1zM15.5 14h1v4h-1zM20 14h1v4h-1zM24.5 14h1v4h-1zM38.5 14h1v4h-1zM43 14h1v4h-1zM47.5 14h1v4h-1zM52 14h1v4h-1zM11 19h42v1H11zM25 11h14l-7 13z"/><path class="index" d="M26.5 12h11L32 22.2z"/></svg>SIGWALD</div>
  <h1 id="title">Opening your database</h1>
  <div class="track" aria-hidden="true"><i id="s0" class="live"></i><i id="s1"></i><i id="s2"></i></div>
  <div class="steps"><span id="l0" class="on">Database</span><span id="l1">Updates</span><span id="l2">Sigwald</span></div>
  <section class="fail" aria-live="assertive">
    <p style="margin:0;color:var(--muted)">Your data is safe on this machine. The log has the details; trying again usually works.</p>
    <pre id="detail"></pre>
    <div class="actions">
      <button class="primary" id="retry" type="button">Try again</button>
      <button id="logs" type="button">Show logs</button>
    </div>
  </section>
</main>
<script>
  var titles = { database: "Opening your database", migrations: "Updating the database", server: "Starting Sigwald" };
  var order = ["database", "migrations", "server"];
  window.sigwaldBootStep = function (step) {
    var at = order.indexOf(step);
    document.getElementById("title").textContent = titles[step] || "Starting Sigwald";
    for (var i = 0; i < 3; i++) {
      var seg = document.getElementById("s" + i), label = document.getElementById("l" + i);
      seg.className = i < at ? "on" : i === at ? "live" : "";
      label.className = i <= at ? "on" : "";
    }
  };
  window.sigwaldBootFailed = function (message) {
    document.getElementById("boot").className = "failed";
    document.getElementById("title").textContent = "Sigwald couldn't start";
    document.getElementById("detail").textContent = message;
    document.getElementById("retry").focus();
  };
  document.getElementById("retry").addEventListener("click", function () { window.sigwaldBoot && window.sigwaldBoot.restart(); });
  document.getElementById("logs").addEventListener("click", function () { window.sigwaldBoot && window.sigwaldBoot.openLogs(); });
</script>
</body>
</html>
